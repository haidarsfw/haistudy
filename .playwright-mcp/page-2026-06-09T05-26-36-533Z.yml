    - paragraph [ref=e18]: "Materi 01: Marketing: Creating Customer Value and Engagement (Chapter 1) [MATERI UJIAN: INTRODUCTION, MARKETING PROCESS, CONCEPTS, CRM] [⚠️]"
    - paragraph [ref=e19]: Materi ini memperkenalkan definisi, proses, dan konsep inti pemasaran.
    - list [ref=e20]:
      - listitem [ref=e21]: "● Definisi Pemasaran (Marketing): Pemasaran adalah proses di mana perusahaan menciptakan nilai (create value) bagi pelanggan dan membangun hubungan pelanggan yang kuat untuk menangkap nilai (capture value) dari pelanggan sebagai imbalannya."
      - listitem [ref=e22]: "● Proses Pemasaran (The Marketing Process): Ini adalah model 5 langkah:"
    - list [ref=e23]:
      - listitem [ref=e24]: ○ Understand the marketplace and customer needs and wants (Memahami pasar serta kebutuhan & keinginan pelanggan).
      - listitem [ref=e25]: ○ Design a customer value-driven marketing strategy (Merancang strategi pemasaran yang berorientasi nilai).
      - listitem [ref=e26]: ○ Construct an integrated marketing program (Membangun program pemasaran terintegrasi yang memberikan nilai superior).
      - listitem [ref=e27]: ○ Engage customers, build profitable relationships (Melibatkan pelanggan, membangun hubungan yang menguntungkan).
      - listitem [ref=e28]: ○ Capture value from customers (Menangkap nilai dari pelanggan untuk menciptakan keuntungan dan ekuitas pelanggan).
    - list [ref=e29]:
      - listitem [ref=e30]: "● 5 Konsep Inti Pasar (5 Core Marketplace Concepts):"
    - list [ref=e31]:
      - listitem [ref=e32]: "○ Needs, Wants, and Demands:"
    - list [ref=e33]:
      - listitem [ref=e34]: "■ Needs (Kebutuhan): Kondisi kekurangan yang dirasakan (states of felt deprivation). Contoh: Butuh laptop untuk kuliah."
      - listitem [ref=e35]: "■ Wants (Keinginan): Bentuk kebutuhan yang dipengaruhi budaya dan kepribadian. Contoh: Ingin baju merek ternama."
      - listitem [ref=e36]: "■ Demands (Permintaan): Keinginan yang didukung oleh daya beli."
    - list [ref=e37]:
      - listitem [ref=e38]: "○ Market Offerings: Kombinasi produk, layanan, informasi, atau pengalaman yang ditawarkan ke pasar untuk memuaskan Needs atau Wants."
    - list [ref=e39]:
      - listitem [ref=e40]: "■ Marketing Myopia: Kesalahan karena terlalu fokus pada produk spesifik, bukan pada manfaat dan pengalaman yang dihasilkan produk tersebut. Contoh: Nokia yang fokus membuat HP, bukan pada apa yang pelanggan lakukan dengan HP (konektivitas, apps)."
    - list [ref=e41]:
      - listitem [ref=e42]: "○ Value and Satisfaction: Pelanggan membentuk ekspektasi akan nilai (value) dan kepuasan (satisfaction) yang diberikan penawaran pasar."
      - listitem [ref=e43]: "○ Exchanges and Relationships: Pertukaran adalah tindakan mendapatkan objek yang diinginkan dengan menawarkan sesuatu sebagai imbalan."
      - listitem [ref=e44]: "○ Markets: Kumpulan semua pembeli aktual dan potensial dari suatu produk atau jasa."
    - list [ref=e45]:
      - listitem [ref=e46]: "● Modern Marketing System: Sebuah sistem di mana perusahaan dan pesaing meneliti pasar dan berinteraksi dengan konsumen untuk memahami kebutuhan mereka. Mereka kemudian menciptakan dan mengirimkan penawaran pasar serta pesan, baik secara langsung maupun melalui perantara pemasaran (marketing intermediaries), kepada konsumen akhir."
      - listitem [ref=e47]: "● Orientasi Manajemen Pemasaran (Marketing Management Orientations): Ada 5 konsep yang memandu strategi pemasaran:"
    - list [ref=e48]:
      - listitem [ref=e49]: "○ Production Concept: Fokus pada ketersediaan dan harga yang terjangkau."
      - listitem [ref=e50]: "○ Product Concept: Fokus pada kualitas, kinerja, dan fitur terbaik."
      - listitem [ref=e51]: "○ Selling Concept: Fokus pada penjualan dan promosi skala besar (pandangan inside-out, dari pabrik ke pasar)."
      - listitem [ref=e52]: "○ Marketing Concept: Fokus pada pemahaman kebutuhan dan keinginan target pasar dan memberikan kepuasan (pandangan outside-in, dari pasar ke pabrik)."
      - listitem [ref=e53]: "○ Societal Marketing Concept: Mempertimbangkan wants konsumen, requirements perusahaan, serta long-run interests konsumen dan masyarakat (segitiga: Society, Consumers, Company) . Contoh: Ben & Jerry's memiliki 3 misi: Produk, Ekonomi, dan Sosial."
    - list [ref=e54]:
      - listitem [ref=e55]: "● Customer Relationship Management (CRM): Proses keseluruhan membangun dan memelihara hubungan pelanggan yang menguntungkan dengan memberikan nilai dan kepuasan pelanggan yang superior."
      - listitem [ref=e56]: "● Customer Relationship Groups: Matriks untuk mengelola pelanggan berdasarkan profitabilitas dan loyalitas:"
    - list [ref=e57]:
      - listitem [ref=e58]: "○ Strangers (Profitabilitas Rendah, Loyalitas Jangka Pendek): Jangan berinvestasi pada mereka."
      - listitem [ref=e59]: "○ Butterflies (Profitabilitas Tinggi, Loyalitas Jangka PendekB): Nikmati saat mereka ada, jangan berinvestasi untuk mengubah mereka."
      - listitem [ref=e60]: "○ True Friends (Profitabilitas Tinggi, Loyalitas Jangka Panjang): Investasi berkelanjutan untuk mengubah mereka menjadi \"True Believers\"."
      - listitem [ref=e61]: "○ Barnacles (Profitabilitas Rendah, Loyalitas Jangka Panjang): Sangat loyal tapi tidak menguntungkan. Contoh: Pelanggan bank yang setia tapi saldonya sangat kecil. Coba tingkatkan profitabilitasnya atau \"pecat\" mereka."
    - separator [ref=e62]
    - paragraph [ref=e63]
    - paragraph [ref=e64]: "Materi 02: Company and Marketing Strategy (Chapter 2) [MATERI UJIAN: STRATEGIC PLANNING, BCG MATRIX, MARKETING MIX] [⚠️]"
    - paragraph [ref=e65]: Materi ini menjelaskan perencanaan strategis di tingkat korporat dan fungsional (pemasaran).
    - list [ref=e66]:
      - listitem [ref=e67]: "● Strategic Planning (Perencanaan Strategis): Proses mengembangkan dan memelihara kesesuaian strategis (strategic fit) antara tujuan dan kapabilitas organisasi dengan peluang pemasaran yang terus berubah."
      - listitem [ref=e68]: "● Langkah-langkah dalam Strategic Planning (Corporate Level):"
    - list [ref=e69]:
      - listitem [ref=e70]: ○ Defining the company mission (Menetapkan misi perusahaan).
      - listitem [ref=e71]: ○ Setting company objectives and goals (Menetapkan tujuan dan sasaran).
      - listitem [ref=e72]: ○ Designing the business portfolio (Merancang portofolio bisnis).
      - listitem [ref=e73]: ○ Planning marketing and other functional strategies (Merencanakan pemasaran, ini terjadi di level unit bisnis).
    - list [ref=e74]:
      - listitem [ref=e75]: "● Mission Statement: Pernyataan tentang tujuan organisasi; apa yang ingin dicapainya di lingkungan yang lebih luas. Misi harus market-oriented (berorientasi pasar), bukan product-oriented."
    - list [ref=e76]:
      - listitem [ref=e77]: "○ Contoh: Misi Starbucks bukan \"Kami menjual kopi dan makanan ringan\" (product-oriented), tetapi \"Kami menjual 'The Starbucks Experience,'...\" ."
    - list [ref=e78]:
      - listitem [ref=e79]: "● Designing the Business Portfolio: Portofolio bisnis adalah kumpulan bisnis dan produk yang membentuk perusahaan. Manajemen harus menganalisis portofolio saat ini."
      - listitem [ref=e80]: "● BCG Growth-Share Matrix: Alat analisis portofolio yang paling terkenal. Ini memetakan SBU (Strategic Business Unit) perusahaan berdasarkan dua dimensi: Market Growth Rate (Tingkat Pertumbuhan Pasar) dan Relative Market Share (Pangsa Pasar Relatif) ."
    - list [ref=e81]:
      - listitem [ref=e82]: "○ Stars (Bintang) (High Growth, High Share): Menjanjikan di masa depan. Perlu investasi besar untuk mendanai pertumbuhan pesat mereka. Contoh: iPhone bagi Apple."
      - listitem [ref=e83]: "○ Cash Cows (Sapi Perah) (Low Growth, High Share): Menghasilkan banyak uang tunai (laba) yang stabil. Investasi rendah. Contoh: Indomie bagi Indofood."
      - listitem [ref=e84]: "○ Question Marks (Tanda Tanya) (High Growth, Low Share): Produk baru yang belum pasti. Perlu keputusan: investasi besar agar jadi Star, atau dihentikan. Contoh: Mobil listrik Tesla di tahun-tahun awal."
      - listitem [ref=e85]: "○ Dogs (Anjing) (Low Growth, Low Share): Tidak menguntungkan. Pertimbangkan untuk dihentikan (divestasi). Contoh: HP Nokia 3310 di masa kini."
    - list [ref=e86]:
      - listitem [ref=e87]: "● Product/Market Expansion Grid (Ansoff Matrix): Alat untuk mengidentifikasi peluang pertumbuhan perusahaan."
    - list [ref=e88]:
      - listitem [ref=e89]: "○ Market Penetration (Existing Product, Existing Market): Meningkatkan penjualan produk saat ini ke segmen pasar saat ini."
      - listitem [ref=e90]: "○ Market Development (Existing Product, New Market): Mengembangkan pasar baru untuk produk saat ini. Contoh: Starbucks berekspansi pesat di Cina (pasar baru)."
      - listitem [ref=e91]: "○ Product Development (New Product, Existing Market): Menawarkan produk baru atau modifikasi ke pasar saat ini."
      - listitem [ref=e92]: "○ Diversification (New Product, New Market): Memulai atau membeli bisnis di luar produk/pasar saat ini."
    - list [ref=e93]:
      - listitem [ref=e94]: "● Marketing Strategy & Marketing Mix:"
    - list [ref=e95]:
      - listitem [ref=e96]: "○ Marketing Strategy: Logika pemasaran di mana perusahaan berharap untuk menciptakan nilai pelanggan dan mencapai hubungan yang menguntungkan. Ini melibatkan Segmentation, Targeting, Positioning (STP) (lihat Ch. 7)."
      - listitem [ref=e97]: "○ Marketing Mix: Kumpulan alat pemasaran taktis yang dapat dikendalikan yang dipadukan perusahaan untuk menghasilkan respons yang diinginkannya di pasar sasaran."
      - listitem [ref=e98]: "○ The 4Ps: Product (Produk), Price (Harga), Place (Tempat/Distribusi), Promotion (Promosi)."
    - separator [ref=e99]
    - paragraph [ref=e100]
    - paragraph [ref=e101]: "Materi 03: Analyzing the Marketing Environment (Chapter 3) [MATERI UJIAN: MICRO & MACRO ENVIRONMENT] [⚠️]"
    - paragraph [ref=e102]: Materi ini membedah kekuatan internal dan eksternal yang memengaruhi kemampuan perusahaan melayani pelanggan.
    - list [ref=e103]:
      - listitem [ref=e104]: "● Marketing Environment: Para pelaku dan kekuatan di luar pemasaran yang memengaruhi kemampuan manajemen pemasaran untuk membangun dan memelihara hubungan dengan pelanggan sasaran."
      - listitem [ref=e105]: "● Microenvironment (Lingkungan Mikro): Para pelaku yang dekat dengan perusahaan dan memengaruhi kemampuannya melayani pelanggan. Terdiri dari:"
    - list [ref=e106]:
      - listitem [ref=e107]: "○ The Company (Perusahaan): Departemen internal (Top management, Finance, R&D, HR) harus bekerja harmonis."
      - listitem [ref=e108]: "○ Suppliers (Pemasok): Menyediakan sumber daya untuk memproduksi barang/jasa. Diperlakukan sebagai mitra . Contoh: IKEA melibatkan pemasoknya secara mendalam dalam proses pengiriman nilai ."
      - listitem [ref=e109]: "○ Marketing Intermediaries (Perantara Pemasaran): Firma yang membantu mempromosikan, menjual, dan mendistribusikan barang. (Reseller, firma distribusi fisik, agensi jasa) ."
      - listitem [ref=e110]: "○ Competitors (Pesaing): Perusahaan harus memposisikan penawarannya lebih kuat daripada pesaing."
      - listitem [ref=e111]: "○ Publics (Publik): Kelompok yang memiliki kepentingan aktual atau potensial pada organisasi (Finansial, Media, Pemerintah, Warga, Lokal, Internal, dll.) ."
      - listitem [ref=e112]: "○ Customers (Pelanggan): Pelaku paling penting. Termasuk pasar Konsumen, Bisnis, Reseller, Pemerintah, dan Internasional ."
    - list [ref=e113]:
      - listitem [ref=e114]: "● Macroenvironment (Lingkungan Makro): Kekuatan sosial yang lebih besar yang memengaruhi lingkungan mikro. Terdiri dari:"
    - list [ref=e115]:
      - listitem [ref=e116]: "○ Demographic: Studi populasi manusia (ukuran, kepadatan, usia, gender, ras, dll.). Contoh: Pemasaran Generasional (Baby Boomers, Gen X, Millennials, Gen Z) ."
      - listitem [ref=e117]: "○ Economic: Faktor yang memengaruhi daya beli konsumen. Contoh: Konsumen menjadi lebih hemat, sehingga Target menekankan proposisi nilai \"expect more, pay less\" ."
      - listitem [ref=e118]: "○ Natural: Lingkungan fisik dan sumber daya alam yang dibutuhkan sebagai input atau dipengaruhi oleh aktivitas pemasaran. Tren: kekurangan bahan baku, polusi, intervensi pemerintah, environmental sustainability ."
      - listitem [ref=e119]: "○ Technological: Kekuatan paling dramatis yang mengubah pasar; menciptakan produk dan peluang baru . Contoh: MagicBand dari Disney."
      - listitem [ref=e120]: "○ Political: Hukum, badan pemerintah, dan kelompok penekan yang memengaruhi atau membatasi organisasi."
      - listitem [ref=e121]: "○ Cultural: Institusi dan kekuatan lain yang memengaruhi nilai, persepsi, dan perilaku dasar masyarakat. Contoh: Aerie's #AerieREAL (body positivity) menjadi bagian integral dari identitas mereknya ."
    - list [ref=e122]:
      - listitem [ref=e123]: "● Responding to the Environment: Perusahaan bisa mengambil pandangan:"
    - list [ref=e124]:
      - listitem [ref=e125]: "○ Uncontrollable/Reactive: Reaktif, hanya beradaptasi dengan kekuatan lingkungan ."
      - listitem [ref=e126]: "○ Proactive: Mengambil tindakan agresif untuk memengaruhi kekuatan di lingkungan ."
    - separator [ref=e127]
    - paragraph [ref=e128]
    - paragraph [ref=e129]: "Materi 04: Managing Marketing Information (Chapter 4) [MATERI UJIAN: MARKETING INFORMATION & RESEARCH] [⚠️]"
    - paragraph [ref=e130]: Materi ini berfokus pada cara perusahaan mendapatkan dan mengelola wawasan pelanggan.
    - list [ref=e131]:
      - listitem [ref=e132]: "● Customer Insights: Pemahaman segar berbasis informasi pemasaran tentang pelanggan dan pasar, yang menjadi dasar untuk menciptakan nilai dan hubungan."
      - listitem [ref=e133]: "● Marketing Information System (MIS): Terdiri dari orang dan prosedur yang didedikasikan untuk menilai kebutuhan informasi, mengembangkan informasi yang dibutuhkan, dan membantu pengambil keputusan menggunakan informasi tersebut untuk menghasilkan wawasan."
      - listitem [ref=e134]: "● Mengembangkan Informasi Pemasaran: Marketer mendapatkan informasi dari tiga sumber :"
    - list [ref=e135]:
      - listitem [ref=e136]: "○ Internal Databases: Kumpulan informasi konsumen dan pasar yang diperoleh dari sumber data di dalam jaringan perusahaan. Contoh: Stitch Fix menggunakan database internal untuk membangun loyalitas pelanggan."
      - listitem [ref=e137]: "○ Competitive Marketing Intelligence: Pengumpulan dan analisis sistematis informasi yang tersedia untuk umum tentang konsumen, pesaing, dan perkembangan di pasar. Contoh: \"Conversation Suite\" dari Mastercard yang memonitor jutaan percakapan brand."
      - listitem [ref=e138]: "○ Marketing Research (Riset Pemasaran): Desain, pengumpulan, analisis, dan pelaporan data secara sistematis yang relevan dengan situasi pemasaran spesifik yang dihadapi organisasi."
    - list [ref=e139]:
      - listitem [ref=e140]: "● Proses Riset Pemasaran (Marketing Research Process): Ini adalah proses 4 langkah yang penting:"
    - list [ref=e141]:
      - listitem [ref=e142]: "○ Defining the problem and research objectives: (Menetapkan masalah dan tujuan riset). Ini adalah langkah paling sulit namun paling penting. Tujuan bisa berupa: Exploratory (eksplorasi), Descriptive (deskriptif), atau Causal (kausal) ."
      - listitem [ref=e143]: "○ Developing the research plan: (Mengembangkan rencana riset). Menguraikan sumber data, pendekatan, metode kontak, dan instrumen."
      - listitem [ref=e144]: "○ Implementing the research plan: (Mengimplementasikan rencana) Mengumpulkan dan menganalisis data."
      - listitem [ref=e145]: "○ Interpreting and reporting the findings: (Menginterpretasi dan melaporkan temuan)."
    - list [ref=e146]:
      - listitem [ref=e147]: "● Data Primer vs. Sekunder:"
    - list [ref=e148]:
      - listitem [ref=e149]: "○ Secondary Data: Informasi yang sudah ada di suatu tempat, dikumpulkan untuk tujuan lain. Keuntungan: Biaya rendah, cepat diperoleh. Kerugian: Mungkin tidak relevan, akurat, atau terkini ."
      - listitem [ref=e150]: "○ Primary Data: Informasi yang dikumpulkan untuk tujuan spesifik yang sedang dihadapi."
    - list [ref=e151]:
      - listitem [ref=e152]: "● Pendekatan Riset (Primary Data):"
    - list [ref=e153]:
      - listitem [ref=e154]: "○ Observational Research: Mengumpulkan data primer dengan mengamati orang, tindakan, dan situasi yang relevan."
      - listitem [ref=e155]: "○ Ethnographic Research: Mengirim pengamat terlatih untuk menonton dan berinteraksi dengan konsumen di \"lingkungan alami\" mereka. Contoh: Program \"follow me home\" dari Intuit."
      - listitem [ref=e156]: "○ Survey Research: Mengumpulkan data dengan bertanya langsung kepada orang-orang."
      - listitem [ref=e157]: "○ Experimental Research: Menguji sebab-akibat dengan memberikan perlakuan berbeda pada kelompok subjek yang dicocokkan. Contoh: A/B testing untuk mesin pencari Bing."
    - list [ref=e158]:
      - listitem [ref=e159]: "● Customer Relationship Management (CRM): Mengelola informasi rinci tentang pelanggan individu dan mengelola \"titik sentuh\" (touch points) pelanggan dengan hati-hati untuk memaksimalkan loyalitas."
    - separator [ref=e160]
    - paragraph [ref=e161]
    - paragraph [ref=e162]: "Materi 05: Consumer Markets and Buyer Behavior (Chapter 5) [MATERI UJIAN: CONSUMER BEHAVIOR] [⚠️]"
    - paragraph [ref=e163]: Materi ini menganalisis pasar konsumen dan faktor-faktor yang memengaruhi keputusan pembelian.
    - list [ref=e164]:
      - listitem [ref=e165]: "● Definisi:"
    - list [ref=e166]:
      - listitem [ref=e167]: "Consumer Buyer Behavior: Perilaku pembelian konsumen akhir—individu dan rumah tangga yang membeli barang dan jasa untuk konsumsi pribadi."
      - listitem [ref=e168]: "Consumer Market: Semua individu dan rumah tangga yang membeli atau memperoleh barang/jasa untuk konsumsi pribadi."
    - list [ref=e169]:
      - listitem [ref=e170]: "● Model Perilaku Pembeli (Buyer Behavior):"
    - list [ref=e171]:
      - listitem [ref=e172]: Pemasar mencari tahu respons terhadap rangsangan pemasaran (4P) dan rangsangan "Lainnya" (Ekonomi, Teknologi, Sosial, Kultural).
      - listitem [ref=e173]: Rangsangan ini masuk ke Buyer's Black Box (kotak hitam pembeli), yang berisi Buyer's characteristics (karakteristik pembeli) dan Buyer's decision process (proses keputusan pembeli).
      - listitem [ref=e174]: "Ini menghasilkan Buyer Responses (respons pembeli): sikap pembelian, perilaku pembelian (apa, kapan, di mana, berapa banyak), dan keterlibatan merek."
    - list [ref=e175]:
      - listitem [ref=e176]: "● Faktor yang Mempengaruhi Perilaku Konsumen (The \"Black Box\"):"
    - list [ref=e177]:
      - listitem [ref=e178]: "Cultural (Kultural):"
    - list [ref=e179]:
      - listitem [ref=e180]: "■ Culture (Budaya): Kumpulan nilai, persepsi, keinginan, dan perilaku dasar yang dipelajari."
      - listitem [ref=e181]: "■ Subculture (Sub-budaya): Kelompok orang dengan sistem nilai bersama berdasarkan pengalaman hidup yang sama. Contoh: Menargetkan konsumen Hispanik, Afrika-Amerika, atau Asia-Amerika."
      - listitem [ref=e182]: "■ Social Class (Kelas Sosial): Divisi masyarakat yang relatif permanen berdasarkan kombinasi pekerjaan, pendapatan, pendidikan, kekayaan, dll."
    - list [ref=e183]:
      - listitem [ref=e184]: "Social (Sosial):"
    - list [ref=e185]:
      - listitem [ref=e186]: "■ Groups and Social Networks: Termasuk reference groups (kelompok referensi) dan opinion leaders (pemimpin opini). Melahirkan word-of-mouth influence dan influencer marketing . Contoh: Kampanye \"I Am What I Make Up\" dari CoverGirl menggunakan brand ambassador berpengaruh."
      - listitem [ref=e187]: "■ Family (Keluarga): Organisasi pembelian konsumen yang paling penting dalam masyarakat."
      - listitem [ref=e188]: ■ Roles and Status (Peran dan Status).
    - list [ref=e189]:
      - listitem [ref=e190]: "Personal (Pribadi):"
    - list [ref=e191]:
      - listitem [ref=e192]: "■ Occupation (Pekerjaan): Mempengaruhi barang/jasa yang dibeli. Contoh: CAT membuat ponsel yang tangguh untuk industri konstruksi."
      - listitem [ref=e193]: ■ Age and Life Stage (Usia dan Tahap Hidup).
      - listitem [ref=e194]: ■ Economic Situation (Situasi Ekonomi).
      - listitem [ref=e195]: "■ Lifestyle (Gaya Hidup): Pola hidup seseorang yang diekspresikan dalam psikografis."
      - listitem [ref=e196]: "■ Personality (Kepribadian): Karakteristik psikologis unik. Contoh: MINI memasarkan ke segmen kepribadian yang \"petualang, individualistis... apa saja selain normal\"."
    - list [ref=e197]:
      - listitem [ref=e198]: "Psychological (Psikologis):"
    - list [ref=e199]:
      - listitem [ref=e200]: "■ Motivation (Motivasi): Kebutuhan yang cukup mendesak untuk mengarahkan seseorang mencari kepuasan. (Lihat: Hirarki Kebutuhan Maslow)."
      - listitem [ref=e201]: "■ Perception (Persepsi): Proses di mana orang memilih, mengatur, dan menginterpretasi informasi. Termasuk: Selective attention (perhatian selektif), Selective distortion (distorsi selektif), dan Selective retention (retensi selektif) ."
      - listitem [ref=e202]: "■ Learning (Pembelajaran): Perubahan perilaku yang timbul dari pengalaman."
      - listitem [ref=e203]: ■ Beliefs (Keyakinan) dan Attitudes (Sikap).
    - list [ref=e204]:
      - listitem [ref=e205]: "● Maslow’s Hierarchy of Needs: Teori motivasi yang menyatakan kebutuhan manusia diatur dalam hierarki : (1) Physiological (fisiologis: lapar, haus), (2) Safety (keamanan), (3) Social (sosial: rasa memiliki, cinta), (4) Esteem (penghargaan: status), (5) Self-actualization (aktualisasi diri) ."
      - listitem [ref=e206]: "● Tipe Perilaku Keputusan Pembelian: Didasarkan pada Involvement (Keterlibatan) dan Differences between brands (Perbedaan antar merek):"
    - list [ref=e207]:
      - listitem [ref=e208]: "Complex Buying Behavior (Keterlibatan Tinggi, Perbedaan Signifikan): Contoh: Membeli mobil baru."
      - listitem [ref=e209]: Dissonance-Reducing Buying Behavior (Keterlibatan Tinggi, Sedikit Perbedaan).
      - listitem [ref=e210]: "Habitual Buying Behavior (Keterlibatan Rendah, Sedikit Perbedaan): Contoh: Membeli garam."
      - listitem [ref=e211]: Variety-Seeking Buying Behavior (Keterlibatan Rendah, Perbedaan Signifikan).
    - list [ref=e212]:
      - listitem [ref=e213]: "● Proses Keputusan Pembeli (Buyer Decision Process): Terdiri dari 5 tahap:"
    - list [ref=e214]:
      - listitem [ref=e215]: "Need recognition (Pengenalan kebutuhan): Dipicu oleh stimuli internal atau eksternal."
      - listitem [ref=e216]: "Information search (Pencarian informasi): Dari sumber personal, komersial, publik, atau eksperiensial."
      - listitem [ref=e217]: Evaluation of alternatives (Evaluasi alternatif).
      - listitem [ref=e218]: "Purchase decision (Keputusan pembelian): Niat membeli bisa berubah karena sikap orang lain atau faktor situasional tak terduga."
      - listitem [ref=e219]: "Postpurchase behavior (Perilaku pasca-pembelian): Kepuasan atau ketidakpuasan."
    - list [ref=e220]:
      - listitem [ref=e221]: "● Cognitive Dissonance: Ketidaknyamanan pembeli yang disebabkan oleh konflik pasca-pembelian."
    - separator [ref=e222]
    - paragraph [ref=e223]
    - paragraph [ref=e224]: "Materi 06: Business Markets and Business Buyer Behavior (Chapter 6) [MATERI UJIAN: BUSINESS BEHAVIOR] [⚠️]"
    - paragraph [ref=e225]: Materi ini berfokus pada pasar B2B (Business-to-Business) dan perilaku pembelinya.
    - list [ref=e226]:
      - listitem [ref=e227]: "● Definisi:"
    - list [ref=e228]:
      - listitem [ref=e229]: "Business Buyer Behavior: Perilaku pembelian organisasi yang membeli barang/jasa untuk digunakan dalam produksi produk/jasa lain yang dijual atau disewakan."
    - list [ref=e230]:
      - listitem [ref=e231]: "● Perbedaan Pasar Bisnis vs. Pasar Konsumen:"
    - list [ref=e232]:
      - listitem [ref=e233]: "Market Structure and Demand (Struktur Pasar dan Permintaan):"
    - list [ref=e234]:
      - listitem [ref=e235]: Fewer but larger buyers (Lebih sedikit tapi pembeli lebih besar).
      - listitem [ref=e236]: "Derived demand (Permintaan turunan): Permintaan B2B berasal dari permintaan konsumen akhir."
      - listitem [ref=e237]: "Inelastic demand (Permintaan tidak elastis): Perubahan harga tidak terlalu memengaruhi permintaan total."
      - listitem [ref=e238]: "Fluctuating demand (Permintaan berfluktuasi): Permintaan lebih berfluktuasi dan lebih cepat."
    - list [ref=e239]:
      - listitem [ref=e240]: "Nature of the Buying Unit (Sifat Unit Pembeli):"
    - list [ref=e241]:
      - listitem [ref=e242]: Melibatkan more decision participants (lebih banyak peserta keputusan).
      - listitem [ref=e243]: Melibatkan more professional purchasing effort (upaya pembelian yang lebih profesional).
    - list [ref=e244]:
      - listitem [ref=e245]: "● Tipe Situasi Pembelian Bisnis (Types of Buying Situations):"
    - list [ref=e246]:
      - listitem [ref=e247]: "Straight Rebuy: Pembeli memesan ulang sesuatu secara rutin tanpa modifikasi."
      - listitem [ref=e248]: "Modified Rebuy: Pembeli ingin memodifikasi spesifikasi produk, harga, syarat, atau pemasok."
      - listitem [ref=e249]: "New Task: Pembeli membeli produk atau jasa untuk pertama kalinya."
    - list [ref=e250]:
      - listitem [ref=e251]: "● Buying Center (Pusat Pembelian):"
    - list [ref=e252]:
      - listitem [ref=e253]: Ini adalah unit pengambilan keputusan dari organisasi pembeli. Terdiri dari semua individu dan unit yang memainkan peran dalam proses keputusan pembelian bisnis.
      - listitem [ref=e254]: "5 Peran dalam Buying Center:"
    - list [ref=e255]:
      - listitem [ref=e256]: "Users (Pengguna): Anggota yang akan menggunakan produk/jasa."
      - listitem [ref=e257]: "Influencers (Pemberi Pengaruh): Sering membantu mendefinisikan spesifikasi dan memberikan info."
      - listitem [ref=e258]: "Buyers (Pembeli): Memiliki wewenang formal untuk memilih pemasok."
      - listitem [ref=e259]: "Deciders (Pengambil Keputusan): Memiliki kekuatan formal/informal untuk memilih pemasok akhir."
      - listitem [ref=e260]: "Gatekeepers (Penjaga Gerbang): Mengontrol aliran informasi ke orang lain."
    - list [ref=e261]:
      - listitem [ref=e262]: "● Proses Keputusan Pembelian Bisnis: Terdiri dari 8 tahap (lebih kompleks daripada proses konsumen):"
    - list [ref=e263]:
      - listitem [ref=e264]: Problem recognition (Pengenalan masalah).
      - listitem [ref=e265]: General need description (Deskripsi kebutuhan umum).
      - listitem [ref=e266]: "Product specification (Spesifikasi produk): Sering menggunakan value analysis untuk mengurangi biaya."
      - listitem [ref=e267]: Supplier search (Pencarian pemasok).
      - listitem [ref=e268]: Proposal solicitation (Pengumpulan proposal).
      - listitem [ref=e269]: Supplier selection (Pemilihan pemasok).
      - listitem [ref=e270]: Order-routine specification (Spesifikasi pesanan rutin).
      - listitem [ref=e271]: Performance review (Tinjauan kinerja).
    - separator [ref=e272]
    - paragraph [ref=e273]
    - paragraph [ref=e274]: "Materi 07: Customer Value-Driven Marketing Strategy (Chapter 7) [MATERI UJIAN: SEGMENTATION, TARGETING, POSITIONING] [⚠️]"
    - paragraph [ref=e275]: "Materi ini adalah inti dari strategi pemasaran modern: Segmenting, Targeting, Differentiation, and Positioning (STP)."
    - list [ref=e276]:
      - listitem [ref=e277]: "● Customer-Driven Marketing Strategy (STP): Perusahaan tidak bisa melayani semua pelanggan; mereka harus memilih siapa yang akan mereka layani. Proses ini memiliki empat langkah:"
    - list [ref=e278]:
      - listitem [ref=e279]: "○ Segmentasi (Segmentation): Membagi pasar total menjadi segmen-segmen yang lebih kecil."
      - listitem [ref=e280]: "○ Targeting (Penargetan): Memilih satu atau lebih segmen untuk dimasuki."
      - listitem [ref=e281]: "○ Differentiation (Diferensiasi): Mendiferensiasikan penawaran pasar untuk menciptakan nilai pelanggan yang superior."
      - listitem [ref=e282]: "○ Positioning (Pemosisian): Memosisikan penawaran pasar di benak pelanggan sasaran."
    - list [ref=e283]:
      - listitem [ref=e284]: "● Market Segmentation:"
    - list [ref=e285]:
      - listitem [ref=e286]: "○ Basis Segmentasi Konsumen:"
    - list [ref=e287]:
      - listitem [ref=e288]: "Geographic: Membagi pasar berdasarkan unit geografis (negara, kota, lingkungan)."
      - listitem [ref=e289]: "Demographic: Berdasarkan variabel seperti usia, tahap siklus hidup, jenis kelamin, pendapatan, pekerjaan."
      - listitem [ref=e290]: "Psychographic: Berdasarkan kelas sosial, gaya hidup, atau karakteristik kepribadian. Contoh: Panera melayani segmen gaya hidup sehat."
      - listitem [ref=e291]: "Behavioral: Berdasarkan pengetahuan, sikap, penggunaan, atau respons konsumen. Contoh: Segmentasi Benefit Sought (manfaat yang dicari). Schwinn membuat e-bike untuk segmen manfaat \"membuat perjalanan lebih mudah\"."
    - list [ref=e292]:
      - listitem [ref=e293]: "○ Multiple Segmentation: Menggunakan beberapa basis segmentasi untuk mengidentifikasi kelompok sasaran yang lebih kecil dan lebih terdefinisi. Contoh: Sistem Experian Mosaic USA yang mengklasifikasikan rumah tangga AS ke dalam 71 segmen gaya hidup."
    - list [ref=e294]:
      - listitem [ref=e295]: "● Market Targeting:"
    - list [ref=e296]:
      - listitem [ref=e297]: "○ Strategi Penargetan (Targeting Strategies):"
    - list [ref=e298]:
      - listitem [ref=e299]: "Undifferentiated (Mass) Marketing: Menargetkan seluruh pasar dengan satu tawaran. Berfokus pada kebutuhan yang sama."
      - listitem [ref=e300]: "Differentiated (Segmented) Marketing: Menargetkan beberapa segmen pasar dan merancang penawaran terpisah untuk masing-masing. Contoh: Marriott International memiliki lebih dari 30 merek hotel (Luxury, Premium, Select) untuk melayani segmen yang berbeda."
      - listitem [ref=e301]: "Concentrated (Niche) Marketing: Menargetkan pangsa besar dari satu atau beberapa pasar yang lebih kecil (niche)."
      - listitem [ref=e302]: "Micromarketing: Menyesuaikan produk/pemasaran untuk individu atau lokasi tertentu. Termasuk Local Marketing dan Individual Marketing. Contoh: Tim desain \"Bespoke\" Rolls-Royce bekerja dengan pelanggan individu."
    - list [ref=e303]:
      - listitem [ref=e304]: "● Differentiation and Positioning:"
    - list [ref=e305]:
      - listitem [ref=e306]: "○ Product Position: Cara produk didefinisikan oleh konsumen berdasarkan atribut-atribut penting; tempat produk berada di benak konsumen relatif terhadap pesaing."
      - listitem [ref=e307]: "○ Positioning Maps: Menunjukkan persepsi konsumen tentang merek mereka versus produk pesaing pada dimensi pembelian penting. Contoh: Peta SUV Mewah yang memetakan merek (Cadillac, Lexus, Land Rover) berdasarkan sumbu Price (Harga) dan Orientation (Performa/Kemewahan)."
      - listitem [ref=e308]: "○ Value Proposition: Campuran penuh manfaat (full mix of benefits) di mana merek diposisikan. Ada lima proposisi nilai yang \"menang\": More for more, More for the same, More for less, The same for less, dan Less for much less."
      - listitem [ref=e309]: "○ Positioning Statement: Pernyataan yang merangkum posisi merek/perusahaan. Formatnya: \"To (target segment and need) our (brand) is (concept) that (point of difference)\"."
    - separator [ref=e310]
    - paragraph [ref=e311]
    - paragraph [ref=e312]: "Materi 08: Products, Services, and Brands (Chapter 8) [MATERI UJIAN: PRODUCTS, SERVICES, BRANDS] [⚠️]"
    - paragraph [ref=e313]: Materi ini membedah konsep produk, layanan, dan strategi branding.
    - list [ref=e314]:
      - listitem [ref=e315]: "● Definisi:"
    - list [ref=e316]:
      - listitem [ref=e317]: "○ Product: Segala sesuatu yang dapat ditawarkan ke pasar untuk perhatian, akuisisi, penggunaan, atau konsumsi yang mungkin memuaskan kebutuhan atau keinginan."
      - listitem [ref=e318]: "○ Services: Bentuk produk yang terdiri dari aktivitas, manfaat, atau kepuasan yang pada dasarnya intangible (tidak berwujud) dan tidak mengakibatkan kepemilikan."
    - list [ref=e319]:
      - listitem [ref=e320]: "● Three Levels of Product (Tiga Level Produk): Ini adalah model inti."
    - list [ref=e321]:
      - listitem [ref=e322]: "○ Core Customer Value: Level paling dasar. Menjawab pertanyaan: \"Apa yang sebenarnya dibeli oleh pelanggan?\" Contoh: Orang yang membeli Harley-Davidson tidak hanya membeli sepeda motor; mereka membeli kebebasan, independensi, dan otentisitas."
      - listitem [ref=e323]: "○ Actual Product: Bagian yang terlihat. Mengubah nilai inti menjadi produk aktual. Meliputi: Brand name, Features, Design, Quality level, Packaging."
      - listitem [ref=e324]: "○ Augmented Product: Produk aktual ditambah layanan tambahan. Meliputi: After-sale service, Warranty, Product support, Delivery and credit."
    - list [ref=e325]:
      - listitem [ref=e326]: "● Klasifikasi Produk Konsumen (Consumer Products):"
    - list [ref=e327]:
      - listitem [ref=e328]: "○ Convenience Products: Sering dibeli, usaha minimal. Contoh: Pasta gigi, majalah, fast food ."
      - listitem [ref=e329]: "○ Shopping Products: Jarang dibeli, pelanggan membandingkan dengan cermat (kualitas, harga, gaya). Contoh: Furnitur, mobil, pakaian ."
      - listitem [ref=e330]: "○ Specialty Products: Karakteristik unik atau identifikasi merek di mana pembeli bersedia melakukan upaya khusus. Contoh: Jam tangan Rolex, pakaian desainer ."
      - listitem [ref=e331]: "○ Unsought Products: Produk yang tidak diketahui konsumen atau diketahui tetapi biasanya tidak terpikir untuk dibeli. Contoh: Asuransi jiwa, donor darah ."
    - list [ref=e332]:
      - listitem [ref=e333]: "● Keputusan Produk Individual: Meliputi: Product attributes (kualitas, fitur, desain), Branding, Packaging, Labeling, dan Product support services."
    - list [ref=e334]:
      - listitem [ref=e335]: "○ Contoh Packaging/Labeling: Mengidentifikasi produk/merek, mendeskripsikan atribut."
    - list [ref=e336]:
      - listitem [ref=e337]: "● Keputusan Lini Produk (Product Line):"
    - list [ref=e338]:
      - listitem [ref=e339]: "○ Product Line: Sekelompok produk yang terkait erat."
      - listitem [ref=e340]: "○ Product Line Length: Jumlah item dalam lini produk. Dapat diperpanjang melalui Line Stretching (menambah produk di luar rentang saat ini) atau Line Filling (menambah item di dalam rentang) . Contoh: BMW meregangkan dan mengisi lininya untuk menarik \"orang kaya, super kaya, dan yang berharap kaya\"."
    - list [ref=e341]:
      - listitem [ref=e342]: "● Keputusan Bauran Produk (Product Mix): Terdiri dari semua lini produk dan item yang ditawarkan penjual. Memiliki 4 dimensi: Width (lebar), Length (panjang), Depth (kedalaman), Consistency (konsistensi)."
      - listitem [ref=e343]: "● Services Marketing (Pemasaran Jasa):"
    - list [ref=e344]:
      - listitem [ref=e345]: "○ Empat Karakteristik Jasa (4 Service Characteristics):"
    - list [ref=e346]:
      - listitem [ref=e347]: "Intangibility: Jasa tidak dapat dilihat, dirasakan, atau dicium sebelum dibeli."
      - listitem [ref=e348]: "Inseparability: Jasa tidak dapat dipisahkan dari penyedianya."
      - listitem [ref=e349]: "Variability: Kualitas jasa bergantung pada siapa, kapan, di mana, dan bagaimana jasa itu diberikan."
      - listitem [ref=e350]: "Perishability: Jasa tidak dapat disimpan untuk dijual atau digunakan nanti."
    - list [ref=e351]:
      - listitem [ref=e352]: "○ Tiga Jenis Pemasaran Jasa:"
    - list [ref=e353]:
      - listitem [ref=e354]: "Internal Marketing: Perusahaan -> Karyawan."
      - listitem [ref=e355]: "External Marketing: Perusahaan -> Pelanggan."
      - listitem [ref=e356]: "Interactive Marketing: Karyawan -> Pelanggan (interaksi pembeli-penjual)."
    - list [ref=e357]:
      - listitem [ref=e358]: "● Brand Strategy (Strategi Merek):"
    - list [ref=e359]:
      - listitem [ref=e360]: "○ Brand Equity: Efek diferensial yang dimiliki oleh pengetahuan nama merek terhadap respons pelanggan."
      - listitem [ref=e361]: "○ Brand Development Strategies (Matriks 2x2):"
    - list [ref=e362]:
      - listitem [ref=e363]: "Line Extension (Existing Brand, Existing Category): Contoh: Rasa baru Indomie Goreng."
      - listitem [ref=e364]: "Brand Extension (Existing Brand, New Category): Contoh: Toyota Camry Hybrid (merek Toyota masuk ke kategori Hybrid)."
      - listitem [ref=e365]: "Multibrands (New Brand, Existing Category): Contoh: Unilever menjual Pepsodent dan Close-Up."
      - listitem [ref=e366]: "New Brands (New Brand, New Category): Contoh: Toyota menciptakan merek Lexus untuk masuk ke pasar mobil mewah."
    - separator [ref=e367]
    - paragraph [ref=e368]
    - paragraph [ref=e369]: "Materi 10: Pricing: Understanding and Capturing Customer Value (Chapter 10) [MATERI UJIAN: PRICING] [⚠️]"
    - paragraph [ref=e370]: Materi ini membahas strategi dan pertimbangan dalam penetapan harga.
    - list [ref=e371]:
      - listitem [ref=e372]: "● Definisi Harga (Price): Jumlah uang yang dibebankan untuk suatu produk/jasa, ATAU jumlah dari semua nilai (sum of all the values) yang ditukar pelanggan untuk mendapatkan manfaat dari produk/jasa."
      - listitem [ref=e373]: "● Tiga Strategi Penetapan Harga Utama (Major Pricing Strategies):"
    - list [ref=e374]:
      - listitem [ref=e375]: "○ Customer Value-Based Pricing (Penetapan Harga Berbasis Nilai Pelanggan):"
    - list [ref=e376]:
      - listitem [ref=e377]: ■ Menggunakan persepsi pembeli tentang nilai, bukan biaya penjual. Ini adalah pendekatan customer-driven (dimulai dengan menilai kebutuhan pelanggan).
      - listitem [ref=e378]: "■ Price Ceiling (Langit-langit Harga): Ditetapkan oleh persepsi nilai konsumen. Tidak ada permintaan di atas harga ini."
      - listitem [ref=e379]: "■ Jenis:"
    - list [ref=e380]:
      - listitem [ref=e381]: "■ Good-Value Pricing: Menawarkan kombinasi yang pas antara kualitas dan layanan baik dengan harga wajar. Termasuk EDLP (Everyday Low Pricing) (harga rendah konstan)."
      - listitem [ref=e382]: "■ Value-Added Pricing: Melampirkan fitur dan layanan bernilai tambah untuk membedakan penawaran dan mendukung harga yang lebih tinggi."
    - list [ref=e383]:
      - listitem [ref=e384]: "○ Cost-Based Pricing (Penetapan Harga Berbasis Biaya):"
    - list [ref=e385]:
      - listitem [ref=e386]: ■ Menetapkan harga berdasarkan biaya produksi, distribusi, dan penjualan, ditambah tingkat pengembalian yang wajar. Ini adalah pendekatan product-driven (dimulai dengan mendesain produk).
      - listitem [ref=e387]: "■ Price Floor (Lantai Harga): Ditetapkan oleh biaya produk. Tidak ada keuntungan di bawah harga ini."
      - listitem [ref=e388]: "■ Jenis:"
    - list [ref=e389]:
      - listitem [ref=e390]: "■ Cost-Plus Pricing (Markup Pricing): Menambahkan markup standar ke biaya produk."
      - listitem [ref=e391]: "■ Break-Even Pricing (Target Return Pricing): Menetapkan harga untuk mencapai titik impas (break-even) atau mencapai target laba."
    - list [ref=e392]:
      - listitem [ref=e393]: "○ Competition-Based Pricing (Penetapan Harga Berbasis Persaingan):"
    - list [ref=e394]:
      - listitem [ref=e395]: ■ Menetapkan harga berdasarkan strategi, biaya, harga, dan penawaran pesaing.
      - listitem [ref=e396]: "■ Contoh: Caterpillar mendominasi industrinya meskipun mengenakan harga premium, karena pelanggan percaya mereka memberikan nilai jangka panjang yang lebih besar daripada pesaing . Studi kasus Gojek & Grab juga membahas ini."
    - list [ref=e397]:
      - listitem [ref=e398]: "● Faktor Lain yang Mempengaruhi Harga:"
    - list [ref=e399]:
      - listitem [ref=e400]: "○ The Market and Demand (Pasar dan Permintaan):"
    - list [ref=e401]:
      - listitem [ref=e402]: "■ Pricing in Different Markets: Pure competition, Monopolistic competition, Oligopolistic competition, Pure monopoly ."
      - listitem [ref=e403]: "■ Price Elasticity of Demand (Elastisitas Harga): Ukuran sensitivitas permintaan terhadap perubahan harga."
    - list [ref=e404]:
      - listitem [ref=e405]: "■ Inelastic Demand: Permintaan hampir tidak berubah ketika harga sedikit berubah."
      - listitem [ref=e406]: "■ Elastic Demand: Permintaan berubah sangat besar ketika harga sedikit berubah."
    - paragraph [ref=e407]
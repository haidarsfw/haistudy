    - generic [ref=e9]: 📚 Rangkuman Mendalam Materi UTS Human Recources Management
  - generic [ref=e13]:
    - heading "📚 Rangkuman Mendalam Materi UTS Human Recources Management" [level=3] [ref=e14]
    - paragraph [ref=e15]: "Materi 01: Introduction to HRM [MATERI UJIAN: INTRODUCTION] [⚠️]"
    - paragraph [ref=e16]: Materi ini memperkenalkan konsep dasar HRM dan perannya dalam fungsi manajemen.
    - list [ref=e17]:
      - listitem [ref=e18]: "● Fungsi Manajemen (POAC): Manajemen adalah sebuah proses. PPT ini menguraikan lima fungsi yang dilakukan manajer:"
    - list [ref=e19]:
      - listitem [ref=e20]: ○ Planning (Perencanaan)
      - listitem [ref=e21]: ○ Organizing (Pengorganisasian)
      - listitem [ref=e22]: ○ Staffing (Penyusunan Staf)
      - listitem [ref=e23]: ○ Leading (Memimpin)
      - listitem [ref=e24]: ○ Controlling (Pengendalian)
    - list [ref=e25]:
      - listitem [ref=e26]: "● Definisi Human Resource Management (HRM): HRM adalah proses acquiring, training, appraising, and compensating (memperoleh, melatih, menilai, dan mengompensasi) karyawan, serta mengurus relasi kerja, kesehatan dan keselamatan, dan isu keadilan."
      - listitem [ref=e27]: ● Mengapa HRM Penting bagi Semua Manajer?
    - list [ref=e28]:
      - listitem [ref=e29]: ○ Untuk menghindari kesalahan personel (personnel mistakes).
      - listitem [ref=e30]: ○ Untuk meningkatkan profit dan kinerja (improve profits and performance) .
    - list [ref=e31]:
      - listitem [ref=e32]: "● Line vs. Staff Authority: Ini adalah konsep fundamental ."
    - list [ref=e33]:
      - listitem [ref=e34]: "○ Line Authority: Memberi manajer hak untuk mengeluarkan perintah (issue orders)."
    - list [ref=e35]:
      - listitem [ref=e36]: "■ Contoh: Manajer Produksi memerintahkan supervisor lini untuk memulai proses manufaktur."
    - list [ref=e37]:
      - listitem [ref=e38]: "○ Staff Authority: Memberi manajer hak untuk memberi saran (advise others)."
    - list [ref=e39]:
      - listitem [ref=e40]: "■ Contoh: Manajer HR (staff) memberi saran kepada Manajer Produksi (line) tentang cara mematuhi undang-undang keselamatan kerja."
    - list [ref=e41]:
      - listitem [ref=e42]: "● Tanggung Jawab HR Seorang Line Manager: Manajer lini (non-HR) tetap memiliki tanggung jawab HR yang krusial , seperti:"
    - list [ref=e43]:
      - listitem [ref=e44]: ○ Menempatkan orang yang tepat di pekerjaan yang tepat (Placing the right person in the right job).
      - listitem [ref=e45]: ○ Melakukan orientasi karyawan baru.
      - listitem [ref=e46]: ○ Melatih karyawan.
      - listitem [ref=e47]: ○ Meningkatkan kinerja pekerjaan setiap orang.
      - listitem [ref=e48]: ○ Mengontrol biaya tenaga kerja (Controlling labor cost).
    - list [ref=e49]:
      - listitem [ref=e50]: "● Tren yang Mempengaruhi HRM:"
    - list [ref=e51]:
      - listitem [ref=e52]: ○ Tren Demografi Tenaga Kerja dan Keragaman.
      - listitem [ref=e53]: ○ Tren Globalisasi dan Ekonomi.
      - listitem [ref=e54]: "○ Tren Teknologi: Terdapat 6 jenis teknologi digital yang mendorong otomatisasi HR: Social Media, Mobile Applications, Cloud Computing, Data Analytics (Analitika Data), Artificial Intelligence (AI), dan Augmented Reality ."
    - separator [ref=e55]
    - paragraph [ref=e56]
    - paragraph [ref=e57]: "Materi 02: Job Analysis & Talent Management [MATERI UJIAN: JOB ANALYSIS & HUBUNGAN TALENT MANAGEMENT DENGAN PERFORMANCE] [⚠️]"
    - paragraph [ref=e58]: Materi ini adalah fondasi dari HRM, menjelaskan cara menganalisis pekerjaan dan mengelola talenta.
    - list [ref=e59]:
      - listitem [ref=e60]: "● Talent Management: Ini adalah proses yang berorientasi pada tujuan dan terintegrasi. Ini adalah proses mengidentifikasi, merekrut, mengembangkan, dan mempertahankan karyawan berkinerja tinggi."
      - listitem [ref=e61]: "● Proses Talent Management: Kisi-kisi Anda menghubungkan ini dengan kinerja. Proses ini adalah siklus berkelanjutan :"
    - list [ref=e62]:
      - listitem [ref=e63]: ○ Memutuskan posisi apa yang akan diisi.
      - listitem [ref=e64]: ○ Membangun pool kandidat (Recruiting).
      - listitem [ref=e65]: ○ Menggunakan alat seleksi (Testing).
      - listitem [ref=e66]: ○ Memutuskan siapa yang akan diberi tawaran (Interviewing).
      - listitem [ref=e67]: ○ Melakukan orientasi, pelatihan, dan pengembangan (Training).
      - listitem [ref=e68]: ○ Menilai kinerja karyawan (Appraise employees).
      - listitem [ref=e69]: ○ Memberi kompensasi untuk menjaga motivasi (Compensate employees).
    - list [ref=e70]:
      - listitem [ref=e71]: "● Definisi Job Analysis (Analisis Pekerjaan): Ini adalah prosedur untuk menentukan tugas (duties) dan persyaratan keterampilan (skill requirements) dari suatu pekerjaan, serta jenis orang (kind of person) yang harus dipekerjakan untuk itu. Sesuai kisi-kisi, jika kinerja rendah, seringkali ini disebabkan oleh analisis pekerjaan yang tidak akurat."
      - listitem [ref=e72]: "● Informasi yang Dikumpulkan dalam Job Analysis:"
    - list [ref=e73]:
      - listitem [ref=e74]: ○ Work activities (Aktivitas kerja).
      - listitem [ref=e75]: ○ Human behaviors (Perilaku manusia).
      - listitem [ref=e76]: ○ Machines, tools, equipment (Mesin, alat, perlengkapan).
      - listitem [ref=e77]: ○ Performance standards (Standar kinerja).
      - listitem [ref=e78]: ○ Job context (Konteks pekerjaan).
      - listitem [ref=e79]: ○ Human requirements (Kebutuhan manusia) .
    - list [ref=e80]:
      - listitem [ref=e81]: "● Metode Pengumpulan Data Job Analysis:"
    - list [ref=e82]:
      - listitem [ref=e83]: "○ The Interview: Wawancara terstruktur atau tidak terstruktur dengan karyawan ."
      - listitem [ref=e84]: "○ Questionnaires: Kuesioner terstruktur ."
      - listitem [ref=e85]: "○ Observations: Mengamati aktivitas fisik yang terlihat (tidak cocok untuk pekerjaan mental) ."
      - listitem [ref=e86]: "○ Participant Diary/Logs: Karyawan mencatat aktivitas mereka ."
    - list [ref=e87]:
      - listitem [ref=e88]: "● Produk dari Job Analysis:"
    - list [ref=e89]:
      - listitem [ref=e90]: "○ Job Description (Deskripsi Pekerjaan): Sebuah pernyataan tertulis tentang apa yang sebenarnya dilakukan oleh pemegang jabatan, bagaimana mereka melakukannya, dan dalam kondisi apa. Bagian utamanya meliputi : Job identification, Job summary, Responsibilities and duties."
      - listitem [ref=e91]: "○ Job Specification (Spesifikasi Pekerjaan): Sebuah daftar \"sifat dan pengalaman manusia yang diperlukan untuk melakukan pekerjaan ini secara efektif\" . Ini menunjukkan kriteria untuk rekrutmen dan seleksi."
    - list [ref=e92]:
      - listitem [ref=e93]: "● Job Redesign:"
    - list [ref=e94]:
      - listitem [ref=e95]: "○ Job Enlargement: Menambah tugas-tugas horizontal (tugas-tugas serupa)."
      - listitem [ref=e96]: "○ Job Rotation: Memindahkan karyawan secara berkala dari satu pekerjaan ke pekerjaan lain."
      - listitem [ref=e97]: "○ Job Enrichment: Mendesain ulang pekerjaan untuk meningkatkan peluang achievement, pengakuan, dan pertumbuhan (menambah tugas-tugas vertikal/manajerial)."
    - separator [ref=e98]
    - paragraph [ref=e99]
    - paragraph [ref=e100]: "Materi 03: Personnel Planning & Recruiting [MATERI UJIAN: PERSONNEL PLANNING] [⚠️]"
    - paragraph [ref=e101]: Materi ini mencakup proses perencanaan kebutuhan SDM hingga membangun pool kandidat.
    - list [ref=e102]:
      - listitem [ref=e103]: "● Workforce Planning: Juga dikenal sebagai employment atau personnel planning (atau Manpower Planning di kisi-kisi). Ini adalah proses untuk memutuskan posisi apa yang harus diisi perusahaan dan bagaimana cara mengisinya ."
      - listitem [ref=e104]: "● Forecasting (Peramalan Kebutuhan): Manajer menggunakan berbagai alat untuk memprediksi kebutuhan personel, seperti:"
    - list [ref=e105]:
      - listitem [ref=e106]: "○ Trend Analysis: Mempelajari data historis jumlah karyawan untuk memprediksi kebutuhan di masa depan."
      - listitem [ref=e107]: "○ Ratio Analysis: Menggunakan rasio antara, misalnya, volume penjualan dan jumlah karyawan yang dibutuhkan."
    - list [ref=e108]:
      - listitem [ref=e109]: "● Succession Planning: Ini adalah proses penting untuk keberlanjutan kepemimpinan. Ini melibatkan 3 langkah: (1) Mengidentifikasi kebutuhan posisi kunci, (2) Mengembangkan kandidat internal, dan (3) Menilai dan memilih kandidat internal untuk mengisi posisi tersebut ."
      - listitem [ref=e110]: "● Recruiting Yield Pyramid: Ini adalah alat penting untuk mengukur efektivitas rekrutmen. Ini menunjukkan jumlah kandidat yang harus dihasilkan di setiap tahap untuk mendapatkan jumlah karyawan baru yang diinginkan."
    - list [ref=e111]:
      - listitem [ref=e112]: "○ Contoh (dari PPT): Untuk mendapatkan 50 karyawan baru, perusahaan mungkin perlu membuat 100 penawaran (rasio 2:1), yang berarti harus mengundang 150 kandidat untuk wawancara (rasio 3:2), yang berasal dari 200 undangan (rasio 4:3), yang dihasilkan dari 1.200 leads awal (rasio 6:1)."
    - list [ref=e113]:
      - listitem [ref=e114]: "● Sumber Kandidat:"
    - list [ref=e115]:
      - listitem [ref=e116]: "○ Internal: \"Hiring from within\" (merekrut dari dalam) melalui job posting (pengumuman lowongan internal) atau inventarisasi kualifikasi karyawan ."
      - listitem [ref=e117]: "○ Eksternal: Merekrut dari luar, termasuk melalui outsourcing (menggunakan vendor luar untuk layanan) dan offshoring (memindahkan layanan ke vendor/karyawan di luar negeri) ."
    - list [ref=e118]:
      - listitem [ref=e119]: "● Recruiting a More Diverse Workforce: Perusahaan harus secara proaktif merekrut kelompok yang beragam, termasuk: Women, Single Parents, Older Workers, Minorities, dan The Disabled ."
    - separator [ref=e120]
    - paragraph [ref=e121]
    - paragraph [ref=e122]: "Materi 04: Testing & Selection [MATERI UJIAN: TESTING & SELECTION] [⚠️]"
    - paragraph [ref=e123]: Materi ini adalah kelanjutan dari rekrutmen, berfokus pada cara menyaring kandidat.
    - list [ref=e124]:
      - listitem [ref=e125]: ● Mengapa Tes dan Seleksi Penting?
    - list [ref=e126]:
      - listitem [ref=e127]: "○ Performance: Karyawan yang dipilih dengan baik cenderung berkinerja lebih baik."
      - listitem [ref=e128]: "○ Cost: Biaya untuk merekrut dan mempekerjakan sangat tinggi."
      - listitem [ref=e129]: "○ Legal obligations: Ada kewajiban hukum untuk menghindari praktik perekrutan yang diskriminatif ."
    - list [ref=e130]:
      - listitem [ref=e131]: "● Kategori Tes Seleksi:"
    - list [ref=e132]:
      - listitem [ref=e133]: "○ Tests of cognitive abilities: Tes kecerdasan (IQ) atau tes kemampuan kognitif spesifik ."
      - listitem [ref=e134]: "○ Tests of motor & physical abilities: Tes untuk mengukur kemampuan fisik atau motorik."
      - listitem [ref=e135]: "○ Measuring personality: Tes untuk mengukur aspek kepribadian."
    - list [ref=e136]:
      - listitem [ref=e137]: "● Work Samples and Simulations: Ini adalah metode seleksi yang kuat di mana kandidat dihadapkan pada situasi yang mewakili pekerjaan sebenarnya."
    - list [ref=e138]:
      - listitem [ref=e139]: "○ Contoh (dari PPT): Management Assessment Centers adalah simulasi di mana manajer dievaluasi dalam serangkaian skenario kerja. Situational Judgment Tests menyajikan skenario kerja yang menantang dan meminta kandidat memilih respons terbaik ."
    - list [ref=e140]:
      - listitem [ref=e141]: "● Background Investigations and Reference Checks:"
    - list [ref=e142]:
      - listitem [ref=e143]: "○ Mengapa? Untuk memverifikasi informasi faktual (misal: pendidikan, riwayat kerja), mengungkap informasi yang merugikan, dan menghindari hiring mistakes ."
      - listitem [ref=e144]: "○ Cara Meningkatkan: Melakukan referensi via telepon, waspada pada \"red flags\", membandingkan aplikasi dengan resume, dan mencoba \"360\" reference checking (menghubungi rekan kerja atau bawahan sebelumnya) ."
    - list [ref=e145]:
      - listitem [ref=e146]: "● Metode Seleksi Lainnya:"
    - list [ref=e147]:
      - listitem [ref=e148]: "○ Graphology: Analisis tulisan tangan untuk menentukan sifat kepribadian ."
      - listitem [ref=e149]: "○ Physical Exams: Dilakukan setelah tawaran pekerjaan diberikan ."
      - listitem [ref=e150]: "○ Substance Abuse Screening: Tes narkoba, yang harus mematuhi regulasi ."
    - separator [ref=e151]
    - paragraph [ref=e152]
    - paragraph [ref=e153]: "Materi 05-06: Interviewing Candidate I & II [MATERI UJIAN: INTERVIEW & INTERVIEW II] [⚠️]"
    - paragraph [ref=e154]: Materi ini mencakup proses wawancara, dari format hingga penawaran kerja.
    - list [ref=e155]:
      - listitem [ref=e156]: "● Klasifikasi Wawancara: Wawancara dapat diklasifikasikan berdasarkan :"
    - list [ref=e157]:
      - listitem [ref=e158]: "○ Structure (Struktur):"
    - list [ref=e159]:
      - listitem [ref=e160]: "■ Structured (Directive): Pewawancara memiliki daftar pertanyaan yang telah disiapkan sebelumnya, seringkali dengan jawaban yang telah diberi skor . Ini lebih valid dan reliabel."
      - listitem [ref=e161]: "■ Unstructured (Nondirective): Pewawancara tidak mengikuti format yang baku."
    - list [ref=e162]:
      - listitem [ref=e163]: "○ Content (Isi/Jenis Pertanyaan):"
    - list [ref=e164]:
      - listitem [ref=e165]: "■ Situational: Menanyakan kandidat apa yang akan mereka lakukan dalam situasi hipotetis. Contoh: \"Bagaimana jika Anda harus menangani pelanggan yang sangat marah?\"."
      - listitem [ref=e166]: "■ Behavioral: Menanyakan kandidat apa yang telah mereka lakukan di masa lalu, berdasarkan premis bahwa perilaku masa lalu adalah prediktor terbaik. Contoh: \"Ceritakan tentang saat Anda pernah menangani pelanggan yang marah.\"."
    - list [ref=e167]:
      - listitem [ref=e168]: "○ Administration (Pelaksanaan):"
    - list [ref=e169]:
      - listitem [ref=e170]: ■ One-on-One atau Panel (diwawancarai oleh beberapa orang sekaligus).
      - listitem [ref=e171]: ■ Sequential (diwawancarai satu per satu oleh orang yang berbeda).
      - listitem [ref=e172]: ■ Computerized atau Online Video (seperti Skype).
    - list [ref=e173]:
      - listitem [ref=e174]: "● Kesalahan Wawancara (Interview Errors):"
    - list [ref=e175]:
      - listitem [ref=e176]: "○ First Impressions (Snap Judgments): Pewawancara membuat penilaian terlalu cepat ."
      - listitem [ref=e177]: "○ Candidate-Order (Contrast) Error: Urutan kandidat memengaruhi evaluasi. Contoh: Kandidat yang \"cukup baik\" bisa terlihat \"sangat baik\" jika diwawancara setelah kandidat yang buruk."
      - listitem [ref=e178]: "○ Pressure to Hire: Kebutuhan mendesak untuk mengisi posisi dapat menurunkan standar seleksi."
    - list [ref=e179]:
      - listitem [ref=e180]: "● Metode STAR (Sesuai Kisi-kisi): Ini adalah teknik untuk menjawab pertanyaan behavioral. Karyawan diminta menjelaskan Situation (Situasi), Task (Tugas), Action (Aksi), dan Result (Hasil) dari pengalaman mereka."
      - listitem [ref=e181]: "● Job Offer (Penawaran Kerja): Tawaran tertulis harus mencakup parameter utama seperti pay rates, benefits, dan actual job duties ."
      - listitem [ref=e182]: "● Employment Contract: Kontrak kerja dapat mencakup durasi, ketentuan pesangon (severance provisions), nondiskolur (nondisclosure requirements), dan covenants not to compete (perjanjian untuk tidak bersaing) ."
    - separator [ref=e183]
    - paragraph [ref=e184]
    - paragraph [ref=e185]: "Materi 07-08: Training and Development [MATERI UJIAN: TRAINING AND DEVELOPMENT] [⚠️]"
    - paragraph [ref=e186]: Materi ini membahas orientasi, pelatihan, dan pengembangan manajemen.
    - list [ref=e187]:
      - listitem [ref=e188]: "● Employee Orientation (Onboarding): Prosedur untuk memberikan karyawan baru informasi latar belakang dasar tentang perusahaan. Tujuannya: Welcome (menyambut), Basic information (memberi info dasar), Understanding the organization (memahami organisasi), dan Socialization (sosialisasi) ."
      - listitem [ref=e189]: "● Training Process (Proses Pelatihan): Pelatihan adalah memberikan karyawan (baru atau lama) keterampilan yang mereka butuhkan untuk melakukan pekerjaan mereka."
      - listitem [ref=e190]: "● Model ADDIE: Ini adalah kerangka kerja inti untuk pelatihan. Sesuai kisi-kisi, ADDIE terdiri dari lima langkah :"
    - list [ref=e191]:
      - listitem [ref=e192]: "Analyze (Analisis): Menganalisis kebutuhan pelatihan, baik strategis maupun current (misal: Task Analysis atau Performance Analysis)."
      - listitem [ref=e193]: "Design (Desain): Merencanakan program pelatihan, menetapkan tujuan pembelajaran, dan menciptakan lingkungan belajar yang memotivasi ."
      - listitem [ref=e194]: "Develop (Pengembangan): Merakit konten dan materi pelatihan (misal: workbooks, slides, online activities) ."
      - listitem [ref=e195]: "Implement (Implementasi): Melaksanakan pelatihan (misal: OJT, online)."
      - listitem [ref=e196]: "Evaluate (Evaluasi): Menilai efektivitas pelatihan."
    - list [ref=e197]:
      - listitem [ref=e198]: "● Analisis Kebutuhan: \"Can’t Do or Won’t Do\": Inti dari performance analysis adalah mencari tahu mengapa kinerja menurun. Apakah karena karyawan tidak bisa (butuh pelatihan) atau tidak mau (butuh motivasi)? ."
      - listitem [ref=e199]: "● Metode Pelatihan:"
    - list [ref=e200]:
      - listitem [ref=e201]: "On-the-Job Training (OJT): Pelatihan di tempat kerja, seperti Coaching (dibimbing atasan) atau Job Rotation (pindah dari satu pekerjaan ke pekerjaan lain) ."
      - listitem [ref=e202]: "Apprenticeship Training: Kombinasi antara instruksi kelas dan OJT."
      - listitem [ref=e203]: "Behavior Modeling: Melibatkan 4 langkah: (1) Modeling (Menunjukkan perilaku), (2) Role-playing (Bermain peran), (3) Social reinforcement (Umpan balik), (4) Transfer of training (Transfer ke pekerjaan) ."
    - list [ref=e204]:
      - listitem [ref=e205]: "● Management Development: Upaya untuk meningkatkan kinerja manajerial ."
    - list [ref=e206]:
      - listitem [ref=e207]: "Contoh Metode: Action Learning (memberi manajer waktu untuk menganalisis dan memecahkan masalah di departemen lain) , Case study method, dan Role-playing."
    - list [ref=e208]:
      - listitem [ref=e209]: "● 9-Box Grid: Alat untuk pengembangan dan suksesi. Ini adalah matriks yang memetakan kandidat berdasarkan Potential (potensi - sumbu Y) dan Performance (kinerja - sumbu X) ."
      - listitem [ref=e210]: "● Evaluasi Pelatihan (Tujuan Kisi-kisi): Manajer mengevaluasi empat efek :"
    - list [ref=e211]:
      - listitem [ref=e212]: "Reactions: Apakah peserta menyukai programnya?"
      - listitem [ref=e213]: "Learning: Apakah mereka mempelajari prinsip atau keterampilan?"
      - listitem [ref=e214]: "Behavior: Apakah perilaku mereka di tempat kerja berubah?"
      - listitem [ref=e215]: "Results: Apakah hasil akhir (misal: produktivitas, kualitas) meningkat?"
    - separator [ref=e216]
    - paragraph [ref=e217]
    - paragraph [ref=e218]: "Materi 09: Equal Opportunity [MATERI UJIAN: EQUAL OPPORTUNITY] [⚠️]"
    - paragraph [ref=e219]: Materi ini berfokus pada undang-undang dan praktik anti-diskriminasi.
    - list [ref=e220]:
      - listitem [ref=e221]: "● Dasar Hukum (AS - Konteks Buku Teks):"
    - list [ref=e222]:
      - listitem [ref=e223]: "Equal Pay Act of 1963: Melarang diskriminasi upah berdasarkan jenis kelamin (sex) untuk pekerjaan yang melibatkan equal work, equivalent skills, dan similar conditions ."
      - listitem [ref=e224]: "Age Discrimination in Employment Act (ADEA) 1967: Melarang diskriminasi terhadap individu berusia 40-65 tahun ."
      - listitem [ref=e225]: "Pregnancy Discrimination Act (PDA) 1978: Melarang diskriminasi berdasarkan kehamilan, persalinan, atau kondisi medis terkait dalam hal hiring, promotion, suspension, atau discharge ."
      - listitem [ref=e226]: "Americans with Disabilities Act (ADA): Melarang diskriminasi terhadap individu yang qualified (memenuhi syarat) dan mewajibkan reasonable accommodation (akomodasi yang wajar) ."
    - list [ref=e227]:
      - listitem [ref=e228]: "● Konteks Indonesia (UU no 40 thn 2008): PPT ini juga menyertakan hukum Indonesia tentang Penghapusan Diskriminasi Ras dan Etnis ."
    - list [ref=e229]:
      - listitem [ref=e230]: Pasal 4 mendefinisikan diskriminasi sebagai "segala bentuk pembedaan, pengecualian, pembatasan, atau pemilihan berdasarkan pada ras dan etnis" yang mengakibatkan pencabutan HAM.
    - list [ref=e231]:
      - listitem [ref=e232]: "● Sexual Harassment (Pelecehan Seksual): Ini adalah bentuk diskriminasi. Ada dua jenis utama :"
    - list [ref=e233]:
      - listitem [ref=e234]: "Quid Pro Quo: (\"Ini untuk itu\") - Menolak ajakan seksual oleh atasan berdampak pada keputusan terkait pekerjaan (misal: promosi, pemecatan)."
      - listitem [ref=e235]: "Hostile Environment: Terjadi ketika perilaku di tempat kerja (misal: komentar, gambar) cukup parah atau meresap sehingga menciptakan lingkungan kerja yang tidak bersahabat atau kasar. Ini bisa diciptakan oleh Supervisors (atasan) atau Coworkers/Nonemployees (rekan kerja/non-karyawan)."
    - separator [ref=e236]
    - paragraph [ref=e237]
    - paragraph [ref=e238]: "Materi 10: Building Positive Employee Relations [MATERI UJIAN: BUILDING POSITIVE RELATIONS] [⚠️]"
    - paragraph [ref=e239]: Materi ini membahas cara membangun hubungan kerja yang positif dan adil.
    - list [ref=e240]:
      - listitem [ref=e241]: "● Employee Relations: Aktivitas yang melibatkan pembentukan dan pemeliharaan hubungan positif antara karyawan dan pemberi kerja yang berkontribusi pada produktivitas, motivasi, dan moral ."
      - listitem [ref=e242]: "● Fair Treatment (Perlakuan Adil): Kunci utama. Ini didasarkan pada dua konsep keadilan :"
    - list [ref=e243]:
      - listitem [ref=e244]: "Procedural Justice: Keadilan dalam proses atau prosedur yang digunakan untuk mengambil keputusan."
      - listitem [ref=e245]: "Distributive Justice: Keadilan dalam hasil atau alokasi (misal: pembagian bonus, promosi)."
    - list [ref=e246]:
      - listitem [ref=e247]: "● Communication Programs: Metode untuk meningkatkan hubungan melalui komunikasi: Focus groups, Suggestion boxes, Hotlines, Exit interviews, dan Open-door policies ."
      - listitem [ref=e248]: "● Employee Involvement Programs: Melibatkan karyawan dalam perusahaan secara positif, melalui :"
    - list [ref=e249]:
      - listitem [ref=e250]: Suggestion Teams, Problem-Solving Teams, Quality Circle (tim yang berfokus pada kualitas), dan Self-Managing/Self-Directed Work Team.
    - list [ref=e251]:
      - listitem [ref=e252]: "● Managing Employee Discipline: Tujuannya bukan untuk menghukum, tetapi \"untuk mendorong karyawan berperilaku bijak di tempat kerja (mematuhi aturan)\"."
      - listitem [ref=e253]: "● The Three Pillars of Fair Discipline: Praktik disiplin yang adil harus didasarkan pada tiga pilar :"
    - list [ref=e254]:
      - listitem [ref=e255]: "Rules & Regulations: Harus ada aturan yang jelas."
      - listitem [ref=e256]: "Progressive Penalties: Hukuman harus bersifat progresif (meningkat). Contoh: Peringatan lisan -> peringatan tertulis -> skorsing -> pemecatan."
      - listitem [ref=e257]: "Appeal Process: Harus ada proses banding yang jelas."
    - list [ref=e258]:
      - listitem [ref=e259]: "● Discipline Without Punishment: Pendekatan alternatif untuk disiplin progresif :"
    - list [ref=e260]:
      - listitem [ref=e261]: Peringatan lisan (oral reminder).
      - listitem [ref=e262]: Peringatan tertulis formal (formal written reminder).
      - listitem [ref=e263]: Memberikan "decision-making leave" (cuti berbayar satu hari agar karyawan merenung apakah akan berkomitmen pada aturan perusahaan).
      - listitem [ref=e264]: Pemecatan (dismissal) jika perilaku berulang.
    - list [ref=e265]:
      - listitem [ref=e266]: "● (Catatan Validasi): Sesuai kisi-kisi, saya telah memeriksa PPT ini untuk konsep \"serikat pekerja (labor union)\". Konsep tersebut tidak ada di dalam materi PPT ini."
    - separator [ref=e267]
    - paragraph [ref=e268]
    - paragraph [ref=e269]: "Materi 11-12: Managing Career and Retention I & II [MATERI UJIAN: CAREER AND RETENTION] [⚠️]"
    - paragraph [ref=e270]: Materi ini membahas manajemen karier dan strategi untuk mempertahankan karyawan.
    - list [ref=e271]:
      - listitem [ref=e272]: "● The Psychological Contract: \"Perjanjian tidak tertulis yang ada antara pemberi kerja dan karyawan\" . Ini mengatur ekspektasi timbal balik (misal: karyawan memberi loyalitas, perusahaan memberi pengembangan karier)."
      - listitem [ref=e273]: "● Peran dalam Manajemen Karier:"
    - list [ref=e274]:
      - listitem [ref=e275]: "○ Employee: Memiliki tanggung jawab utama (primary responsibility) untuk karier mereka ."
      - listitem [ref=e276]: "○ Employer: Memberikan realistic job interviews, rotasi pekerjaan, dan career-oriented appraisals (penilaian kinerja yang berorientasi karier) ."
    - list [ref=e277]:
      - listitem [ref=e278]: "● Coaching vs. Mentoring: Ini adalah dua konsep yang berbeda:"
    - list [ref=e279]:
      - listitem [ref=e280]: "○ Coaching (Pelatihan): Berfokus pada pengajaran tugas harian yang mudah dipelajari kembali ."
      - listitem [ref=e281]: "○ Mentoring (Pendampingan): Melibatkan orang senior berpengalaman yang memberi nasihat dan membimbing pengembangan karier jangka panjang karyawan ."
    - list [ref=e282]:
      - listitem [ref=e283]: "● Employee Turnover (Perputaran Karyawan):"
    - list [ref=e284]:
      - listitem [ref=e285]: "○ Involuntary (Tidak sukarela): Misal, pemecatan."
      - listitem [ref=e286]: "○ Voluntary (Sukarela): Misal, pengunduran diri."
    - list [ref=e287]:
      - listitem [ref=e288]: "● Comprehensive Approach to Retaining Employees: Upaya mempertahankan karyawan (retensi) mencakup :"
    - list [ref=e289]:
      - listitem [ref=e290]: "○ Exit Interviews: Wawancara dengan karyawan yang pergi untuk mencari tahu alasannya."
      - listitem [ref=e291]: "○ Attitude Surveys: Survei untuk mengukur kepuasan."
      - listitem [ref=e292]: "○ Stay Interviews: Wawancara dengan karyawan saat ini untuk memahami mengapa mereka bertahan dan apa yang mungkin membuat mereka pergi."
    - list [ref=e293]:
      - listitem [ref=e294]: "● Managing Dismissals (Pemecatan): Sesuai kisi-kisi, ini penting untuk mengelola retensi best employee dan mengevaluasi yang lain."
    - list [ref=e295]:
      - listitem [ref=e296]: "○ Grounds for Dismissal (Alasan Pemecatan): Ini adalah daftar penting :"
    - list [ref=e297]:
      - listitem [ref=e298]: Unsatisfactory Performance (Kinerja Tidak Memuaskan).
      - listitem [ref=e299]: Misconduct (Perilaku Buruk).
      - listitem [ref=e300]: Lack of Qualifications (Kurangnya Kualifikasi).
      - listitem [ref=e301]: Changed Requirements of the Job (Perubahan Kebutuhan Pekerjaan).
      - listitem [ref=e302]: Insubordination (Pembangkangan).
    - list [ref=e303]:
      - listitem [ref=e304]: "○ Wrongful Discharge: Pemecatan yang tidak mematuhi hukum atau kontrak . Termasuk constructive discharge, di mana perusahaan memaksa karyawan untuk keluar dengan menciptakan kondisi kerja yang tidak tertahankan ."
    - list [ref=e305]:
      - listitem [ref=e306]: "● The Termination Interview (Wawancara Pemecatan): Proses formal untuk memberhentikan karyawan. Langkah-langkahnya: Plan (Rencanakan), Get to the point (Langsung ke intinya), Describe the situation (Jelaskan situasi), Listen (Dengarkan), Review the severance package (Tinjau paket pesangon) ."
    - separator [ref=e307]
    - paragraph [ref=e308]
    - paragraph [ref=e309]: "Materi 13: Business Ethics & Corporate Social Responsibility [MATERI UJIAN: ESG AND GOOD CORPORATE GOVERNANCE] [⚠️]"
    - paragraph [ref=e310]: Materi ini membahas etika dan tanggung jawab sosial, yang terkait dengan ESG dan GCG.
    - list [ref=e311]:
      - listitem [ref=e312]: "● Ethics (Etika): Berasal dari kata Yunani ethos, mengacu pada nilai, norma, dan keyakinan. Ini adalah standar tentang bagaimana orang seharusnya bertindak."
      - listitem [ref=e313]: "● Business Ethics (Etika Bisnis): Fokusnya adalah bagaimana institusi bisnis seharusnya distrukturkan dan tanggung jawab mereka kepada masyarakat. Tujuannya adalah \"menciptakan keadaan di mana orang baik dapat berbuat baik, dan orang jahat dicegah berbuat jahat\"."
      - listitem [ref=e314]: "● Decision Making Process for Ethics: Ini adalah kerangka kerja 7 langkah untuk mengambil keputusan etis :"
    - list [ref=e315]:
      - listitem [ref=e316]: Determine the facts (Tentukan fakta).
      - listitem [ref=e317]: Identify the ethical issue involved (Identifikasi isu etisnya).
      - listitem [ref=e318]: Identify stakeholders (Identifikasi pemangku kepentingan) dan lihat dari sudut pandang mereka.
      - listitem [ref=e319]: Consider the available alternatives (Pertimbangkan alternatif).
      - listitem [ref=e320]: "Compare and weight alternatives (Bandingkan dan beri bobot: konsekuensi, tugas, prinsip)."
      - listitem [ref=e321]: Make decision (Buat keputusan).
      - listitem [ref=e322]: Monitor and learn (Pantau dan pelajari hasilnya).
    - list [ref=e323]:
      - listitem [ref=e324]: "● Corporate Social Responsibility (CSR): Bentuk regulasi diri bisnis swasta internasional yang bertujuan untuk berkontribusi pada tujuan sosial (filantropi, aktivis, amal) ."
      - listitem [ref=e325]: "● Tiga Pendekatan CSR: PPT menunjukkan tiga level CSR:"
    - list [ref=e326]:
      - listitem [ref=e327]: "CSR as corporate philanthropy: Level terendah (2 bintang). Dampak strategis kecil. Contoh: Memberi donasi atau sponsor acara."
      - listitem [ref=e328]: "CSR as risk management: Level menengah (3 bintang). Tujuan: Kepatuhan (Compliance). Contoh: Memitigasi dampak operasional atau risiko."
      - listitem [ref=e329]: "CSR as value creation: Level tertinggi (5 bintang). Dampak strategis fundamental. Contoh: Model bisnis inovatif dan berkelanjutan yang terintegrasi ke dalam strategi bisnis."
    - list [ref=e330]:
      - listitem [ref=e331]: "● The Triple Bottom Line: Sesuai dengan konsep ESG di kisi-kisi, ini adalah konsep bahwa perusahaan harus mengukur dampak sosial dan lingkungan mereka, selain kinerja keuangan. Dikenal sebagai \"Three Ps\": Profit, People, and the Planet ."
    - separator [ref=e332]
    - paragraph [ref=e333]
    - paragraph [ref=e334]: "Materi 14: Benefits and Services [MATERI UJIAN: TOTAL COMPENSATION] [⚠️]"
    - paragraph [ref=e335]: Materi ini membahas komponen kompensasi non-gaji.
    - list [ref=e336]:
      - listitem [ref=e337]: "● Benefits (Tunjangan): Pembayaran finansial tidak langsung dan nonfinansial yang diterima karyawan untuk melanjutkan pekerjaan mereka."
      - listitem [ref=e338]: "● Total Kompensasi: Sesuai dengan kisi-kisi, PPT ini menyatakan bahwa tunjangan karyawan menyumbang sekitar 31% dari total kompensasi (menyiratkan 69% sisanya adalah upah dan gaji)."
      - listitem [ref=e339]: "● Jenis Tunjangan Utama:"
    - list [ref=e340]:
      - listitem [ref=e341]: "○ Pay for Time Not Worked: Tunjangan yang paling mahal. Termasuk hari libur (holidays), cuti (vacations), cuti sakit (sick leave), cuti pemakaman (funeral leave), dan severance pay (pesangon)."
      - listitem [ref=e342]: "○ Insurance Benefits: Workers' compensation (kompensasi kecelakaan kerja), Health insurance (asuransi kesehatan) ."
    - list [ref=e343]:
      - listitem [ref=e344]: "■ Contoh Asuransi Kesehatan: HMO (Health Maintenance Organization) dan PPO (Preferred Provider Organization) ."
    - list [ref=e345]:
      - listitem [ref=e346]: "○ Retirement Benefits: Social Security dan Pension Plans (Program Pensiun)."
    - list [ref=e347]:
      - listitem [ref=e348]: "● Personal and Family-Friendly Benefits:"
    - list [ref=e349]:
      - listitem [ref=e350]: "○ Employee Assistance Programs (EAPs): Menyediakan layanan konseling untuk masalah pribadi yang dapat memengaruhi pekerjaan ."
      - listitem [ref=e351]: "○ Family-Friendly: Fasilitas penitipan anak (child care), subsidi pendidikan (educational subsidies)."
    - list [ref=e352]:
      - listitem [ref=e353]: "● Flexible Work Schedules:"
    - list [ref=e354]:
      - listitem [ref=e355]: "○ Flextime: Karyawan memiliki fleksibilitas jam kerja."
      - listitem [ref=e356]: "○ Telecommuting: Bekerja dari jarak jauh."
      - listitem [ref=e357]: "○ Compressed Workweek: Bekerja lebih lama per hari, tetapi lebih sedikit hari per minggu."
      - listitem [ref=e358]: "○ Job Sharing: Dua orang berbagi satu pekerjaan penuh waktu."
    - list [ref=e359]:
      - listitem [ref=e360]: "● Flexible Benefits: The Cafeteria Approach: Pendekatan di mana karyawan dapat memilih tunjangan yang mereka inginkan (seperti memilih makanan di kafetaria)."
    - separator [ref=e361]
    - paragraph [ref=e362]
    - paragraph [ref=e363]: "Materi 15-16: Performance Management and Appraisal I & II [MATERI UJIAN: HUBUNGAN TALENT MANAGEMENT DENGAN PERFORMANCE] [⚠️]"
    - paragraph [ref=e364]: Materi ini membahas perbedaan antara penilaian kinerja (kejadian) dan manajemen kinerja (proses).
    - list [ref=e365]:
      - listitem [ref=e366]: "● Performance Appraisal Process: Proses 3 langkah: (1) Menetapkan standar kerja, (2) Menilai kinerja aktual, (3) Memberikan umpan balik ."
      - listitem [ref=e367]: ● Mengapa Menilai Kinerja? Untuk keputusan gaji, promosi, dan retensi; untuk mengoreksi kekurangan dan memperkuat kelebihan; dan untuk mengidentifikasi kebutuhan pelatihan .
      - listitem [ref=e368]: ● Siapa yang Menilai?
    - list [ref=e369]:
      - listitem [ref=e370]: "○ Peer Appraisals (Rekan kerja), Rating Committees (Komite), Self-Ratings (Diri sendiri), Appraisal by Subordinates (Bawahan), dan 360-Degree Feedback (umpan balik dari semua pihak: atasan, rekan, bawahan, diri sendiri) ."
    - list [ref=e371]:
      - listitem [ref=e372]: "● Alat Penilaian Kinerja Tradisional:"
    - list [ref=e373]:
      - listitem [ref=e374]: "○ Graphic Rating Scale: Alat paling sederhana, menilai trait (sifat) seperti kualitas kerja atau kuantitas."
      - listitem [ref=e375]: "○ Forced Distribution Method: \"Memaksa\" manajer untuk mendistribusikan karyawan dalam kurva (misal: 10% teratas, 80% tengah, 10% terbawah)."
      - listitem [ref=e376]: "○ Management by Objectives (MBO): Manajer dan karyawan menetapkan tujuan kinerja spesifik yang terukur bersama-sama."
    - list [ref=e377]:
      - listitem [ref=e378]: "● Masalah/Kesalahan Penilaian (Rater Errors):"
    - list [ref=e379]:
      - listitem [ref=e380]: "○ Unclear Standards: Standar yang ambigu (misal: \"kinerja baik\")."
      - listitem [ref=e381]: "○ Halo Effect: Ketika satu trait positif (misal: \"ramah\") memengaruhi penilaian trait lain (misal: \"kualitas kerja\")."
      - listitem [ref=e382]: "○ Central Tendency: Kecenderungan menilai semua karyawan di titik tengah (rata-rata)."
      - listitem [ref=e383]: "○ Leniency or Strictness: Kecenderungan menilai semua bawahan terlalu tinggi (leniency) atau terlalu rendah (strictness)."
      - listitem [ref=e384]: "○ Recency Effects: Membiarkan aktivitas terbaru (baik atau buruk) membayangi kinerja sepanjang tahun."
    - list [ref=e385]:
      - listitem [ref=e386]: "● Performance Management (Manajemen Kinerja):"
    - list [ref=e387]:
      - listitem [ref=e388]: ○ Ini berbeda dari appraisal. Performance Management adalah proses berkelanjutan (continuous process) untuk mengidentifikasi, mengukur, dan mengembangkan kinerja individu/tim dan menyelaraskan kinerja tersebut dengan tujuan organisasi.
      - listitem [ref=e389]: "○ Hubungan dengan Talent Management (Analisis Kisi-kisi): Kisi-kisi Anda menghubungkan ini dengan Talent Management. Manajemen kinerja adalah alat kunci dalam Talent Management. Dengan terus-menerus mengembangkan kinerja (bukan hanya menilai setahun sekali), perusahaan dapat mengelola talenta secara proaktif untuk meningkatkan produktivitas dan mencapai tujuan strategis."
    - paragraph [ref=e390]